# Final config (HTTPS), installed by `make ssl` once the certificate exists.

# HTTP: ACME challenges + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sandset.selys.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to the Docker container (127.0.0.1:9020)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sandset.selys.app;

    ssl_certificate     /etc/letsencrypt/live/sandset.selys.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandset.selys.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    access_log /var/log/nginx/sandset.selys.app.access.log;
    error_log  /var/log/nginx/sandset.selys.app.error.log;

    location / {
        proxy_pass http://127.0.0.1:9020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
