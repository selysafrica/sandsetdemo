# nginx inside the container: serves the Vite build as a SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (React Router): unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
